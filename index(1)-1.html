<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#07110a" />
  <title>Medhat Elbaz | Cybersecurity</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      padding: 24px; color: #eaf5eb;
      font-family: Inter, system-ui, -apple-system, Segoe UI, Arial, sans-serif;
      background: radial-gradient(ellipse at top, #15351d 0%, #08120b 42%, #050807 100%);
    }
    .card {
      width: min(100%, 440px); text-align: center; padding: 36px 26px 28px;
      border: 1px solid rgba(75, 220, 95, .22); border-radius: 24px;
      background: rgba(10, 19, 12, .82); box-shadow: 0 24px 70px rgba(0,0,0,.45);
      backdrop-filter: blur(12px);
    }
    .mark {
      width: 76px; height: 76px; margin: 0 auto 18px; border-radius: 22px;
      display: grid; place-items: center; color: #8cff8c; font-size: 28px; font-weight: 800;
      border: 1px solid #35d335; background: rgba(53,211,53,.08);
      box-shadow: 0 0 28px rgba(53,211,53,.12);
    }
    h1 { margin: 0; font-size: clamp(24px, 6vw, 31px); letter-spacing: 1.5px; }
    .role { margin: 10px 0 26px; color: #a9b9ad; font-size: 14px; }
    .links { display: grid; gap: 13px; }
    .link {
      display: flex; align-items: center; justify-content: center; gap: 11px;
      width: 100%; padding: 16px 18px; border-radius: 13px;
      color: #eaf5eb; text-decoration: none; font-weight: 650; letter-spacing: .2px;
      background: #122219; border: 1px solid rgba(77, 211, 83, .28);
      transition: transform .18s ease, border-color .18s ease, background .18s ease, box-shadow .18s ease;
    }
    .link:hover { transform: translateY(-2px); border-color: #35d335; background: #183321; box-shadow: 0 8px 24px rgba(53,211,53,.12); }
    .icon { color: #72ef7b; width: 21px; height: 21px; flex: 0 0 auto; }
    footer { margin-top: 25px; font-size: 12px; color: #718177; letter-spacing: 1px; }
    @media (prefers-reduced-motion: reduce) { .link { transition: none; } .link:hover { transform: none; } }
  </style>
</head>
<body>
  <main class="card">
    <div class="mark" aria-hidden="true">ME</div>
    <h1>MEDHAT ELBAZ</h1>
    <p class="role">Junior Penetration Tester · Cybersecurity</p>
    <nav class="links" aria-label="Professional links">

        View My CV

      <a class="link" href="https://www.linkedin.com/in/medhatelbaz" target="_blank" rel="noopener noreferrer">
        <svg class="icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M20.45 20.45h-3.56v-5.58c0-1.33-.02-3.04-1.85-3.04-1.85 0-2.13 1.44-2.13 2.94v5.68H9.35V9h3.42v1.56h.05c.48-.9 1.64-1.85 3.38-1.85 3.61 0 4.27 2.38 4.27 5.47v6.27zM5.34 7.43a2.06 2.06 0 1 1 0-4.12 2.06 2.06 0 0 1 0 4.12zM7.12 20.45H3.56V9h3.56v11.45z"/></svg>
        LinkedIn Profile
      </a>
      <a class="link" href="https://medhatelbaz.github.io/" target="_blank" rel="noopener noreferrer">

        My Portfolio

    </nav>
    <footer>CONNECT · LEARN · SECURE</footer>

</body>
</html>
