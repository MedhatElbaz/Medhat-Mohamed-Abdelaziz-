<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#07110a" />
  <title>Medhat Elbaz | Cybersecurity</title>
  <style>
    * { box-sizing: border-box; }
    :root { color-scheme: dark; }
    body {
      margin: 0; min-height: 100svh; display: grid; place-items: center;
      padding: clamp(18px, 5vw, 40px); color: #eaf5eb;
      font-family: Inter, system-ui, -apple-system, Segoe UI, Arial, sans-serif;
      background:
        radial-gradient(circle at 50% 8%, rgba(44,115,54,.30), transparent 34%),
        radial-gradient(ellipse at top, #12291a 0%, #07110a 48%, #040605 100%);
    }
    .card {
      width: min(100%, 460px); text-align: center;
      padding: clamp(28px, 6vw, 42px) clamp(20px, 5vw, 34px) 30px;
      border: 1px solid rgba(75, 220, 95, .25); border-radius: 28px;
      background: linear-gradient(160deg, rgba(13,25,16,.96), rgba(7,13,9,.96));
      box-shadow: 0 28px 80px rgba(0,0,0,.52), inset 0 1px 0 rgba(255,255,255,.035);
      backdrop-filter: blur(14px);
    }
    .mark {
      width: 78px; height: 78px; margin: 0 auto 20px; border-radius: 24px;
      display: grid; place-items: center; color: #8cff8c; font-size: 27px; font-weight: 800;
      letter-spacing: 1px; border: 1px solid rgba(53,211,53,.85);
      background: linear-gradient(145deg, rgba(53,211,53,.12), rgba(53,211,53,.025));
      box-shadow: 0 0 30px rgba(53,211,53,.10);
    }
    h1 { margin: 0; font-size: clamp(23px, 6vw, 30px); line-height: 1.2; letter-spacing: clamp(1px, .4vw, 2px); }
    .role { margin: 12px 0 30px; color: #a9b9ad; font-size: clamp(13px, 3.5vw, 14px); line-height: 1.5; }
    .links { display: grid; gap: 12px; }
    .link {
      display: flex; align-items: center; justify-content: center; gap: 12px;
      min-height: 58px; width: 100%; padding: 15px 18px; border-radius: 14px;
      color: #edf8ef; text-decoration: none; font-weight: 650; font-size: 15px; letter-spacing: .2px;
      background: linear-gradient(110deg, rgba(19,38,25,.96), rgba(13,27,18,.96));
      border: 1px solid rgba(77, 211, 83, .25);
      transition: transform .18s ease, border-color .18s ease, background .18s ease, box-shadow .18s ease;
    }
    .link:hover, .link:focus-visible {
      transform: translateY(-2px); outline: none; border-color: #43df4a;
      background: linear-gradient(110deg, #173323, #112619);
      box-shadow: 0 9px 26px rgba(53,211,53,.13);
    }
    .icon { color: #72ef7b; width: 21px; height: 21px; flex: 0 0 auto; }
    .qr-panel { margin: 24px auto 0; padding: 18px 16px 16px; width: min(100%, 290px); border: 1px solid rgba(75,220,95,.16); border-radius: 18px; background: rgba(5,12,7,.48); }
    .qr-panel img { display: block; width: 148px; height: 148px; margin: 0 auto 12px; padding: 7px; border-radius: 12px; background: #fff; }
    .qr-title { margin: 0 0 6px; color: #dff7e2; font-size: 13px; font-weight: 650; }
    .qr-sub { margin: 0; color: #84968a; font-size: 12px; line-height: 1.5; }
    .copy-btn { margin-top: 14px; padding: 10px 14px; border: 1px solid rgba(75,220,95,.28); border-radius: 10px; background: rgba(35,91,43,.22); color: #8cff8c; font: inherit; font-size: 12px; cursor: pointer; transition: background .18s, border-color .18s; }
    .copy-btn:hover, .copy-btn:focus-visible { outline: none; border-color: #35d335; background: rgba(35,91,43,.42); }
    footer { margin-top: 24px; font-size: 11px; color: #718177; letter-spacing: 1.5px; }
    @media (max-width: 380px) {
      .card { border-radius: 22px; padding: 26px 18px 24px; }
      .link { min-height: 54px; font-size: 14px; }
      .role { margin-bottom: 24px; }
    }
    @media (min-width: 700px) {
      .card { padding: 42px 34px 32px; }
    }
    @media (prefers-reduced-motion: reduce) { .link { transition: none; } .link:hover { transform: none; } }
  </style>
</head>
<body>
  <main class="card">
    <div class="mark" aria-hidden="true">ME</div>
    <h1>MEDHAT ELBAZ</h1>
    <p class="role">Junior Penetration Tester · Cybersecurity</p>
    <nav class="links" aria-label="Professional links">
      <a class="link" href="https://medhatelbaz.github.io/Medhat-Elbaz-CV.pdf" target="_blank" rel="noopener noreferrer">

        View My CV

      <a class="link" href="https://www.linkedin.com/in/medhatelbaz" target="_blank" rel="noopener noreferrer">

        LinkedIn Profile
      </a>
      <a class="link" href="https://medhatelbaz.github.io/" target="_blank" rel="noopener noreferrer">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15 15 0 0 1 0 20M12 2a15 15 0 0 0 0 20"/></svg>
        My Portfolio
      </a>
    </nav>
    <section class="qr-panel" aria-label="Share this link">
      <img src="https://api.qrserver.com/v1/create-qr-code/?size=180x180&margin=2&data=https%3A%2F%2Fmedhatelbaz.github.io%2FMedhat-Mohamed-Abdelaziz-%2F" alt="QR code for Medhat Elbaz link hub" loading="lazy" />
      <p class="qr-title">SCAN TO CONNECT</p>
      <p class="qr-sub">Save or share my professional links in one place.</p>
      <button class="copy-btn" type="button" onclick="navigator.clipboard.writeText('https://medhatelbaz.github.io/Medhat-Mohamed-Abdelaziz-/').then(()=>{this.textContent='Link Copied ✓'}).catch(()=>{this.textContent='Copy failed — use browser address bar'})">Copy Link</button>
    </section>
    <footer>CONNECT · LEARN · SECURE</footer>
  </main>
</body>
</html>
