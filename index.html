<style>
*{box-sizing:border-box}
:root{color-scheme:dark}
body{margin:0;min-height:100svh;display:flex;align-items:center;justify-content:center;padding:24px;background:radial-gradient(circle at 50% 15%,#12251a 0,transparent 40%),#050907;color:#edf6ef;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}
main{width:min(100%,440px);text-align:center;padding:38px 26px 32px;border:1px solid rgba(100,255,120,.18);border-radius:26px;background:rgba(9,16,11,.88);box-shadow:0 28px 80px rgba(0,0,0,.45)}

.role{margin:12px 0 30px;color:#a8b9ad;font-size:14px}
.links{display:grid;gap:12px}
.btn{min-height:56px;display:flex;align-items:center;justify-content:center;gap:11px;padding:14px 18px;border:1px solid rgba(100,255,120,.2);border-radius:13px;background:#101a13;color:#edf6ef;text-decoration:none;font-size:14px;font-weight:700;transition:.2s}
.btn svg{width:19px;height:19px;color:#69ff78}
.btn:hover,.btn:focus-visible{outline:none;transform:translateY(-2px);border-color:#69ff78;background:#15261a;box-shadow:0 8px 24px rgba(65,255,90,.1)}
@media(max-width:360px){main{padding:30px 18px}.photo{width:128px;height:128px}}
@media(prefers-reduced-motion:reduce){.btn{transition:none}.btn:hover{transform:none}}
