<style>
*{box-sizing:border-box}
:root{color-scheme:dark}
html{min-height:100%;background:#030805}
body{margin:0;min-height:100svh;display:flex;align-items:center;justify-content:center;padding:24px;overflow-x:hidden;background:radial-gradient(ellipse at 50% 10%,rgba(24,75,37,.25),transparent 48%),#030805;color:#edf6ef;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}
#matrix{position:fixed;inset:0;width:100%;height:100%;z-index:0;opacity:.32;pointer-events:none}
body:after{content:"";position:fixed;inset:0;z-index:1;pointer-events:none;background:repeating-linear-gradient(0deg,transparent 0 3px,rgba(0,0,0,.12) 4px)}
main{position:relative;z-index:2;width:min(100%,460px);text-align:center;padding:36px 27px 30px;border:1px solid rgba(100,255,120,.28);border-radius:25px;background:linear-gradient(145deg,rgba(10,22,13,.94),rgba(5,12,8,.96));box-shadow:0 28px 90px rgba(0,0,0,.62),0 0 35px rgba(54,255,91,.08),inset 0 1px rgba(255,255,255,.04);backdrop-filter:blur(12px);animation:cardIn .8s ease both}
main:before{content:"";position:absolute;inset:8px;border:1px solid rgba(105,255,120,.07);border-radius:18px;pointer-events:none}
@keyframes cardIn{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
.topline{display:flex;justify-content:center;align-items:center;gap:8px;margin:0 0 22px;color:#83ed91;font:11px/1.4 ui-monospace,SFMono-Regular,Consolas,monospace;letter-spacing:2px;text-transform:uppercase}
.dot{width:7px;height:7px;border-radius:50%;background:#69ff78;box-shadow:0 0 12px #69ff78;animation:pulse 1.6s infinite}
@keyframes pulse{50%{opacity:.35;box-shadow:0 0 3px #69ff78}}
.photo{width:142px;height:142px;margin:0 auto 21px;padding:4px;border-radius:50%;background:conic-gradient(from 0deg,#69ff78,#15331d,#69ff78);box-shadow:0 0 25px rgba(105,255,120,.2);animation:halo 5s linear infinite}
@keyframes halo{to{filter:hue-rotate(18deg)}}
.photo img{display:block;width:100%;height:100%;border-radius:50%;object-fit:cover;border:3px solid #09110b}
h1{font-size:clamp(22px,5.8vw,28px);line-height:1.25;letter-spacing:1.2px;margin:0;text-shadow:0 0 18px rgba(105,255,120,.15)}
.role{margin:11px 0 20px;color:#a8b9ad;font-size:13px;letter-spacing:.4px}
.terminal{margin:0 auto 24px;padding:12px 13px;border:1px solid rgba(105,255,120,.16);border-radius:10px;background:rgba(0,0,0,.3);text-align:left;color:#9ab6a0;font:11px/1.6 ui-monospace,SFMono-Regular,Consolas,monospace;min-height:43px}
.prompt{color:#69ff78}.typed{color:#d5f9d9}
.links{display:grid;gap:11px}
.btn{position:relative;overflow:hidden;min-height:54px;display:flex;align-items:center;justify-content:center;gap:11px;padding:13px 18px;border:1px solid rgba(100,255,120,.23);border-radius:12px;background:linear-gradient(100deg,rgba(16,29,19,.96),rgba(10,19,13,.96));color:#edf6ef;text-decoration:none;font-size:14px;font-weight:700;letter-spacing:.2px;transition:transform .22s,border-color .22s,box-shadow .22s,background .22s}
.btn:before{content:"";position:absolute;top:0;left:-120%;width:70%;height:100%;transform:skewX(-20deg);background:linear-gradient(90deg,transparent,rgba(105,255,120,.09),transparent);transition:left .55s}
.btn svg{width:19px;height:19px;color:#69ff78;flex:none}
.btn:hover,.btn:focus-visible{outline:none;transform:translateY(-2px);border-color:#69ff78;background:#14271a;box-shadow:0 8px 25px rgba(65,255,90,.13),inset 0 0 15px rgba(65,255,90,.04)}
.btn:hover:before{left:150%}
footer{margin-top:22px;color:#55715b;font:10px ui-monospace,SFMono-Regular,Consolas,monospace;letter-spacing:1.3px}
@media(max-width:360px){main{padding:29px 18px 25px}.photo{width:126px;height:126px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}#matrix{display:none}}
</style>
</head>
<body>

<main>

<script>
(() => {
 const canvas=document.getElementById('matrix'),ctx=canvas.getContext('2d');
 const chars='アカサタナハマヤラワ0123456789ABCDEF<>/{}[]$#';
 let w=0,h=0,cols=0,drops=[];
 const resize=()=>{const dpr=Math.min(window.devicePixelRatio||1,2);w=window.innerWidth;h=window.innerHeight;canvas.width=w*dpr;canvas.height=h*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);cols=Math.ceil(w/19);drops=Array.from({length:cols},()=>Math.random()*-h/16)};
 resize();window.addEventListener('resize',resize,{passive:true});
 let last=0;
 function draw(t){if(t-last>55){last=t;ctx.fillStyle='rgba(3,8,5,.12)';ctx.fillRect(0,0,w,h);ctx.font='13px monospace';for(let i=0;i<drops.length;i++){const ch=chars[Math.floor(Math.random()*chars.length)];ctx.fillStyle=Math.random()>.985?'#d5ffd9':'#35d65b';ctx.fillText(ch,i*19,drops[i]*19);if(drops[i]*19>h&&Math.random()>.975)drops[i]=0;drops[i]+=.45+Math.random()*.55}}requestAnimationFrame(draw)}
 if(!window.matchMedia('(prefers-reduced-motion: reduce)').matches)requestAnimationFrame(draw);
})();
const lines=['scanning for vulnerabilities...','loading penetration testing toolkit...','access granted: welcome to my profile'];
const el=document.getElementById('terminalText');let line=0,pos=0,back=false;
function type(){const s=lines[line];if(!back){el.textContent=s.slice(0,++pos);if(pos===s.length){back=true;setTimeout(type,1450);return}}else{el.textContent=s.slice(0,--pos);if(pos===0){back=false;line=(line+1)%lines.length}}setTimeout(type,back?24:48)}
setTimeout(type,700);
</script>
